<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080a11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="A 3D hyperbolic tree browser for the history of computing."
    />
    <title>The Binary Tree</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/logo.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://en.wikipedia.org" crossorigin />
    <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin />

    <!--
      Critical styles, inline and ahead of everything. The real stylesheet is
      imported from the module graph, so on a dev server it only arrives once the
      JS has parsed, and until then the page painted white with unstyled controls
      stacked down the side. A first paint has to be the right colour, and the
      chrome has to stay out of sight until it has been laid out.
    -->
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #080a11;
      }

      body {
        overflow: hidden;
        color: #e9eef7;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      /* Everything but the canvas waits. main.ts lifts this on init, with a
         watchdog, so a build that fails to start still shows its own chrome
         rather than an empty dark rectangle. */
      body:not([data-ready]) .bar,
      body:not([data-ready]) .panel,
      body:not([data-ready]) .tabbar,
      body:not([data-ready]) .search {
        opacity: 0;
        pointer-events: none;
      }

      .bar,
      .panel,
      .tabbar {
        transition: opacity 0.3s ease;
      }

      @media (prefers-reduced-motion: reduce) {
        .bar,
        .panel,
        .tabbar {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage" class="stage"></div>

    <!-- Top bar. Collapses to an app bar under 860px. -->
    <header class="bar bar--top">
      <button id="menu" type="button" class="icon-btn bar__menu" aria-label="Show controls">
        <span class="icon-bars"></span>
      </button>

      <div class="brand">
        <img class="brand__mark" src="/logo.png" width="36" height="36" alt="" />
        <span class="brand__text">
          <strong>The Binary Tree</strong>
          <span id="tagline">the family tree of computing</span>
        </span>
      </div>

      <div id="search" class="search" data-active="false" role="search">
        <div class="search__field">
          <span class="icon-search" aria-hidden="true"></span>
          <input
            id="search-input"
            type="search"
            placeholder="Search the tree"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="search"
            aria-label="Search the tree"
            aria-controls="search-results"
          />
          <kbd class="search__key" aria-hidden="true">/</kbd>
          <button id="search-close" type="button" class="icon-btn search__close" aria-label="Close search">
            <span class="icon-x"></span>
          </button>
        </div>
        <!-- Starts hidden. An empty results list still paints its border,
             background and shadow, which put a small blank card under the field
             before anyone had typed. -->
        <ul id="search-results" class="search__results" role="listbox" hidden></ul>
      </div>

      <div class="tools">
        <button id="search-open" type="button" class="icon-btn tools__search" aria-label="Search">
          <span class="icon-search"></span>
        </button>
        <button id="home" type="button" class="btn" title="Bring the root to the centre (Home)">
          <span class="icon-target" aria-hidden="true"></span>
          <span class="btn__label">Recentre</span>
        </button>
        <button id="tour" type="button" class="btn" aria-pressed="false" title="Guided tour">
          <span class="icon-play" aria-hidden="true"></span>
          <span class="btn__label">Tour</span>
        </button>
        <button id="theme" type="button" class="icon-btn" aria-label="Light and dark theme">
          <span class="icon-contrast"></span>
        </button>
      </div>
    </header>

    <!-- Detail view: a card on desktop, a drag-to-expand sheet on a phone. -->
    <aside id="panel" class="panel" data-empty="true" data-sheet="half" aria-live="polite">
      <div id="panel-grab" class="panel__grab">
        <span class="panel__handle" aria-hidden="true"></span>
        <div id="panel-peek" class="peek"></div>
      </div>
      <nav id="panel-walk" class="walk" aria-label="Move through the tree">
        <button type="button" data-walk="parent" title="Parent">
          <span class="icon-up"></span><span>Parent</span>
        </button>
        <button type="button" data-walk="prev" title="Previous sibling" aria-label="Previous sibling">
          <span class="icon-left"></span>
        </button>
        <button type="button" data-walk="next" title="Next sibling" aria-label="Next sibling">
          <span class="icon-right"></span>
        </button>
        <button type="button" data-walk="child" title="First branch">
          <span class="icon-down"></span><span>Branch</span>
        </button>
      </nav>
      <div id="panel-body" class="panel__body"></div>
    </aside>

    <!-- Bottom controls. Becomes a tab bar plus a collapsible drawer on mobile. -->
    <footer id="bottom" class="bar bar--bottom">
      <div class="timeline">
        <label for="year">Up to <output id="year-out">all</output></label>
        <input id="year" type="range" min="1600" max="2026" value="2026" step="1" />
      </div>
      <ul id="legend" class="legend" aria-label="Eras"></ul>
      <p class="help">
        <kbd>drag</kbd> pull a node <span>·</span>
        <kbd>drag empty space</kbd> orbit <span>·</span>
        <kbd>wheel</kbd> fly in <span>·</span>
        <kbd>arrows</kbd> walk
      </p>
    </footer>

    <nav id="tabbar" class="tabbar" aria-label="Actions">
      <button id="tab-home" type="button">
        <span class="icon-target"></span>
        <span>Centre</span>
      </button>
      <button id="tab-search" type="button">
        <span class="icon-search"></span>
        <span>Search</span>
      </button>
      <button id="tab-tour" type="button" aria-pressed="false">
        <span class="icon-play"></span>
        <span>Tour</span>
      </button>
      <button id="tab-filter" type="button" aria-pressed="false">
        <span class="icon-slider"></span>
        <span>Filter</span>
      </button>
      <button id="tab-theme" type="button">
        <span class="icon-contrast"></span>
        <span>Theme</span>
      </button>
    </nav>

    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
